# Official DiffIRS2 test config, pointed at CSIG validation pairs.
# Copied from DiffIR-demotionblur/options/test_DiffIRS2.yml.
# scale: 4 is CPEN PixelUnshuffle, not output upscaling.
# window_size: 8 only pads to a multiple of 8; it is not 4K tiling.
name: test_DiffIRS2_csig
model_type: DiffIRS2Model
scale: 4
num_gpu: auto
manual_seed: 0

datasets:
  val:
    name: CSIGVal
    type: DeblurPairedDataset
    dataroot_gt: D:/MyProjects/CSIG/CSIG_baseline_strategy_benchmark_analysis_2026-09-06/CSIG_baseline_strategy_benchmark_analysis_2026-09-06/baseline_bakeoff/datasets/csig_val/gt
    dataroot_lq: D:/MyProjects/CSIG/CSIG_baseline_strategy_benchmark_analysis_2026-09-06/CSIG_baseline_strategy_benchmark_analysis_2026-09-06/baseline_bakeoff/datasets/csig_val/lq
    io_backend:
      type: disk

network_g:
  type: DiffIRS2
  n_encoder_res: 5
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [3,5,6,6]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2
  bias: False
  LayerNorm_type: WithBias
  n_denoise_res: 1
  linear_start: 0.1
  linear_end: 0.99
  timesteps: 4

network_S1:
  type: DiffIRS1
  n_encoder_res: 5
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [3,5,6,6]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2
  bias: False
  LayerNorm_type: WithBias

path:
  pretrain_network_g: D:/MyProjects/CSIG/model_cache/diffir_motion_deblurring/Deblurring-DiffIRS2.pth
  pretrain_network_S1: D:/MyProjects/CSIG/model_cache/diffir_motion_deblurring/Deblurring-DiffIRS1.pth
  param_key_g: params_ema
  strict_load_g: False
  ignore_resume_networks: network_S1

val:
  save_img: True
  suffix: ~
  window_size: 8
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: False
